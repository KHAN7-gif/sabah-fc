name: Sync club PNG logos
on:
  push:
    paths:
      - '.github/workflows/sync-club-logos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate PNG assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/logos
          curl -fLsS --retry 3 --max-time 40 -A 'Mozilla/5.0' 'https://img.wh.sportingpulseinternational.com/abc3a087b75aaf4a66b35b680c4555dbT1.png' -o assets/logos/sabah-fc.png
          curl -fLsS --retry 3 --max-time 40 -A 'Mozilla/5.0' 'https://images.statsengine.playbyplay.api.geniussports.com/9bea79e68b1acf201c9cd33b43c5fc29T1.png' -o assets/logos/star-city-fc.png
          curl -fLsS --retry 3 --max-time 40 -A 'Mozilla/5.0' 'https://img.wh.sportingpulseinternational.com/890eb8b4b847c81bf384716e95f5ccbaS1.png' -o assets/logos/johor-darul-tazim.png
          curl -fLsS --retry 3 --max-time 40 -A 'Mozilla/5.0' 'https://img.wh.sportingpulseinternational.com/9ce673be0b491f95f3b6077962503ca7S1.png' -o assets/logos/kuching-city-fc.png
          curl -fLsS --retry 3 --max-time 40 -A 'Mozilla/5.0' 'https://img.wh.sportingpulseinternational.com/0fa110f3396e16423e0374d4971384dcS1.png' -o assets/logos/negeri-sembilan-fc.png
          curl -fLsS --retry 3 --max-time 40 -A 'Mozilla/5.0' 'https://images.statsengine.playbyplay.api.geniussports.com/d30ee7d204ad9059c6984d5169ebc9e3S1.png' -o assets/logos/kuala-lumpur-city-fc.png
          curl -fLsS --retry 3 --max-time 40 -A 'Mozilla/5.0' 'https://img.wh.sportingpulseinternational.com/7563506f40c4d5d4bf0c10725375456bS1.png' -o assets/logos/terengganu-fc.png
          curl -fLsS --retry 3 --max-time 40 -A 'Mozilla/5.0' 'https://images.statsengine.playbyplay.api.geniussports.com/9487fb69f7c90e3d11e9b9b35917f604S1.png' -o assets/logos/melaka-fc.png
          curl -fLsS --retry 3 --max-time 40 -A 'Mozilla/5.0' 'https://images.statsengine.playbyplay.api.geniussports.com/fb1cb1e2d38c83b27bf87abedf1d4729S1.png' -o assets/logos/kelantan-red-warrior-fc.png
          curl -fLsS --retry 3 --max-time 40 -A 'Mozilla/5.0' 'https://img.wh.sportingpulseinternational.com/c479d3abd4aeddd69b4b00f9c2f2a1f7S1.png' -o assets/logos/selangor-fc.png
          curl -fLsS --retry 3 --max-time 40 -A 'Mozilla/5.0' 'https://img.wh.sportingpulseinternational.com/453cbede387d27df529743d3933d0620S1.png' -o assets/logos/penang-fc.png
          curl -fLsS --retry 3 --max-time 40 -A 'Mozilla/5.0' 'https://images.statsengine.playbyplay.api.geniussports.com/6c8a92ad650a441193992f5c8e9f604dS1.png' -o assets/logos/dpmm-fc.png
          python3 - <<'PY'
          from pathlib import Path
          for f in Path('assets/logos').glob('*.png'):
              assert f.read_bytes().startswith(b'\x89PNG\r\n\x1a\n'), f'{f} is not a valid PNG'
              print(f, f.stat().st_size, 'bytes')
          PY
      - name: Update app to use local PNG files
        shell: python
        run: |
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          s=s.replace('https://img.wh.sportingpulseinternational.com/abc3a087b75aaf4a66b35b680c4555dbT1.png','assets/logos/sabah-fc.png')
          s=s.replace('https://images.statsengine.playbyplay.api.geniussports.com/9bea79e68b1acf201c9cd33b43c5fc29T1.png','assets/logos/star-city-fc.png')
          p.write_text(s)
          p=Path('index.html')
          s=p.read_text().replace('club-crests-20261101','local-png-crests-20261101')
          p.write_text(s)
      - name: Commit local PNG assets and references
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logos/sabah-fc.png assets/logos/star-city-fc.png assets/logos/johor-darul-tazim.png assets/logos/kuching-city-fc.png assets/logos/negeri-sembilan-fc.png assets/logos/kuala-lumpur-city-fc.png assets/logos/terengganu-fc.png assets/logos/melaka-fc.png assets/logos/kelantan-red-warrior-fc.png assets/logos/selangor-fc.png assets/logos/penang-fc.png assets/logos/dpmm-fc.png app.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Store twelve club logos as local PNG assets"
            git push
          fi
