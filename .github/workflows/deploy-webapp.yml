name: Deploy Sabah FC webapp
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-sabah-fc-webapp
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate authentication and build
        run: |
          node --check app.js
          node --test tests/publish.test.mjs
          node tools/build-worker-assets.mjs
      - name: Resolve deployment account
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { resolveCloudflareAccount } from './notifications/deployment-account.mjs';
          const account = await resolveCloudflareAccount(process.env.CLOUDFLARE_API_TOKEN, process.env.CLOUDFLARE_ACCOUNT_ID);
          appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ACCOUNT_ID=${account}\n`);
          JS
      - name: Deploy Worker and custom domain
        run: npx --yes wrangler@4.47.0 deploy --config wrangler.jsonc
