name: Install kickoff notifications
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: install-kickoff-notifications
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test schedule and push encryption
        run: node tests/notifications.test.mjs
      - name: Install Worker, private signing keys, scheduler and Pages binding
        run: node tools/deploy-notifications.mjs
